<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Flores Amarillas para ti Laura!💛</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,
body{
    width:100%;
    height:100%;
    overflow:hidden;
}

body{
    background:
        radial-gradient(
            circle at 50% 35%,
            #62c9b4 0%,
            #3aa99c 45%,
            #23877d 100%
        );

    font-family:Arial,sans-serif;
}


/* =================================
   CANVAS
================================= */

canvas{
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
}


/* =================================
   MENSAJE
================================= */

.mensaje{
    position:fixed;

    top:35px;
    left:0;

    width:100%;

    text-align:center;

    z-index:20;

    pointer-events:none;

    padding:0 15px;
}

.titulo{

    color:#fff8a0;

    font-family:cursive;

    font-size:
        clamp(28px,7vw,58px);

    font-weight:bold;

    text-shadow:
        0 2px 3px rgba(0,0,0,.2),
        0 0 15px rgba(255,255,120,.35);
}

.subtitulo{

    margin-top:8px;

    color:white;

    font-family:cursive;

    font-size:
        clamp(17px,4vw,28px);

    text-shadow:
        0 2px 4px rgba(0,0,0,.2);
}


/* =================================
   BOTÓN DE INICIO
================================= */

#inicio{

    position:fixed;

    inset:0;

    z-index:100;

    display:flex;

    justify-content:center;

    align-items:center;

    background:
        linear-gradient(
            rgba(20,100,90,.82),
            rgba(20,100,90,.82)
        );

    transition:
        opacity .8s ease,
        visibility .8s ease;
}

#inicio.oculto{

    opacity:0;

    visibility:hidden;

    pointer-events:none;
}


.boton{

    border:0;

    padding:
        16px 30px;

    border-radius:50px;

    background:
        linear-gradient(
            135deg,
            #fff17a,
            #ffd21c
        );

    color:#765500;

    font-size:18px;

    font-weight:bold;

    box-shadow:
        0 8px 30px rgba(0,0,0,.25);

    cursor:pointer;

    animation:
        pulsar 2s infinite;
}


@keyframes pulsar{

    0%,100%{
        transform:scale(1);
    }

    50%{
        transform:scale(1.05);
    }

}


/* =================================
   TEXTO INFERIOR
================================= */

.abajo{

    position:fixed;

    bottom:20px;

    left:0;

    width:100%;

    text-align:center;

    color:rgba(255,255,255,.85);

    font-size:14px;

    z-index:20;

    pointer-events:none;
}

</style>
</head>


<body>


<!-- =================================
     PANTALLA DE INICIO
================================= -->

<div id="inicio">

    <button
        class="boton"
        id="comenzar">

        🌻 Toca para comenzar 🌻

    </button>

</div>


<!-- =================================
     TEXTO
================================= -->

<div class="mensaje">

    <div class="titulo">
        Flores Amarillas Para ti Laura
    </div>

    <div class="subtitulo">
        PARA TI💛
    </div>

</div>


<canvas id="canvas"></canvas>


<div class="abajo">
    💛 TE AMO 💛
</div>


<!-- =================================
     MÚSICA
================================= -->

<audio
    id="musica"
    src="musica.mp3"
    loop
    preload="auto">
</audio>


<script>


/* ==========================================
   CANVAS
========================================== */

const canvas =
    document.getElementById("canvas");

const ctx =
    canvas.getContext("2d");


let W = 0;
let H = 0;
let DPR = 1;


function resize(){

    DPR =
        Math.min(
            window.devicePixelRatio || 1,
            2
        );

    W =
        window.innerWidth;

    H =
        window.innerHeight;


    canvas.width =
        W * DPR;

    canvas.height =
        H * DPR;


    canvas.style.width =
        W + "px";

    canvas.style.height =
        H + "px";


    ctx.setTransform(
        DPR,
        0,
        0,
        DPR,
        0,
        0
    );

}


resize();

window.addEventListener(
    "resize",
    resize
);


/* ==========================================
   CONFIGURACIÓN DE FLORES
========================================== */


/*
    x = posición horizontal
    base = altura desde abajo
    size = tamaño
    delay = momento en que empieza
*/

const flores = [

    {
        x:.50,
        base:.92,
        size:1.15,
        delay:0
    },

    {
        x:.40,
        base:.94,
        size:1.00,
        delay:550
    },

    {
        x:.60,
        base:.94,
        size:1.02,
        delay:900
    },

    {
        x:.32,
        base:.96,
        size:.88,
        delay:1350
    },

    {
        x:.68,
        base:.96,
        size:.90,
        delay:1700
    },

    {
        x:.46,
        base:.95,
        size:.82,
        delay:2200
    },

    {
        x:.55,
        base:.95,
        size:.85,
        delay:2600
    }

];


/* ==========================================
   PARTÍCULAS
========================================== */

const particulas = [];


for(let i=0;i<45;i++){

    particulas.push({

        x:Math.random(),

        y:Math.random(),

        size:
            1.5 +
            Math.random()*3,

        speed:
            .00005 +
            Math.random()*.00008,

        phase:
            Math.random()*Math.PI*2

    });

}


/* ==========================================
   DIBUJAR TALLO
========================================== */

function dibujarTallo(
    flor,
    crecimiento,
    tiempo
){

    const x =
        flor.x * W;

    const base =
        flor.base * H;


    const altura =
        Math.min(
            H * .55,
            330 * flor.size
        );


    const alturaActual =
        altura * crecimiento;


    /*
       Movimiento por viento
    */

    const viento =
        Math.sin(
            tiempo * .0015 +
            flor.x * 10
        ) * 8 * crecimiento;


    ctx.save();


    ctx.beginPath();


    ctx.moveTo(
        x,
        base
    );


    /*
       Curva del tallo
    */

    ctx.bezierCurveTo(

        x - 10 + viento,
        base - alturaActual*.30,

        x + 15 + viento,
        base - alturaActual*.70,

        x + viento,
        base - alturaActual

    );


    ctx.strokeStyle =
        "#24783b";


    ctx.lineWidth =
        Math.max(
            3,
            7 * flor.size
        );


    ctx.lineCap =
        "round";


    ctx.stroke();


    ctx.restore();


    return {

        x:x + viento,

        y:
            base -
            alturaActual,

        altura:alturaActual,

        viento:viento

    };

}


/* ==========================================
   DIBUJAR HOJA
========================================== */

function dibujarHoja(
    x,
    y,
    lado,
    tamaño,
    apertura
){

    ctx.save();

    ctx.translate(
        x,
        y
    );


    const angulo =
        lado *
        .45;


    ctx.rotate(angulo);


    ctx.fillStyle =
        "#48a94b";


    ctx.beginPath();


    ctx.moveTo(0,0);


    ctx.bezierCurveTo(

        lado * tamaño*.55,
        -tamaño*.30,

        lado * tamaño,
        -tamaño*.05,

        lado * tamaño*1.15,
        0

    );


    ctx.bezierCurveTo(

        lado * tamaño*.65,
        tamaño*.25,

        lado * tamaño*.25,
        tamaño*.22,

        0,
        0

    );


    ctx.closePath();

    ctx.fill();


    /*
       Nervadura
    */

    ctx.strokeStyle =
        "rgba(30,110,45,.55)";

    ctx.lineWidth=1.3;

    ctx.beginPath();

    ctx.moveTo(0,0);

    ctx.lineTo(
        lado*tamaño,
        0
    );

    ctx.stroke();


    ctx.restore();

}


/* ==========================================
   DIBUJAR FLOR
========================================== */

function dibujarFlor(
    x,
    y,
    tamaño,
    apertura,
    tiempo,
    semilla
){

    ctx.save();


    /*
       Movimiento de la flor
    */

    const movimiento =
        Math.sin(
            tiempo*.0014 +
            semilla
        ) * 9;


    const rotacion =
        Math.sin(
            tiempo*.0011 +
            semilla
        ) * .08;


    ctx.translate(
        x + movimiento,
        y
    );


    ctx.rotate(rotacion);


    /*
       PÉTALOS
    */

    const petalos = 24;


    for(
        let i=0;
        i<petalos;
        i++
    ){

        const angulo =
            i *
            Math.PI*2 /
            petalos;


        ctx.save();

        ctx.rotate(angulo);


        /*
           Apertura progresiva
        */

        const distancia =
            15 +
            31 * apertura;


        ctx.translate(
            0,
            -distancia
        );


        /*
           Pétalo
        */

        const ancho =
            12 * tamaño;

        const largo =
            27 * tamaño *
            apertura;


        ctx.fillStyle =
            i % 3 === 0
                ? "#ffe43b"
                : "#ffd21c";


        ctx.beginPath();


        ctx.ellipse(

            0,
            0,

            ancho,

            largo,

            0,
            0,
            Math.PI*2

        );


        ctx.fill();


        /*
           brillo del pétalo
        */

        ctx.fillStyle =
            "rgba(255,248,120,.45)";


        ctx.beginPath();


        ctx.ellipse(

            -2,
            -7,

            ancho*.38,

            largo*.35,

            -.2,
            0,
            Math.PI*2

        );


        ctx.fill();


        ctx.restore();

    }


    /*
       CENTRO
    */

    const radio =
        18 *
        tamaño *
        apertura;


    ctx.fillStyle =
        "#71400b";


    ctx.beginPath();

    ctx.arc(
        0,
        0,
        radio,
        0,
        Math.PI*2
    );

    ctx.fill();


    /*
       Semillas del centro
    */

    ctx.fillStyle =
        "#b07818";


    for(
        let i=0;
        i<35;
        i++
    ){

        const angulo =
            (i * 2.399) +
            semilla;


        const r =
            radio *
            (.2 +
            ((i*17)%100)/100*.65);


        const px =
            Math.cos(angulo)*r;

        const py =
            Math.sin(angulo)*r;


        ctx.beginPath();

        ctx.arc(
            px,
            py,
            1.5*tamaño,
            0,
            Math.PI*2
        );

        ctx.fill();

    }


    ctx.restore();

}


/* ==========================================
   DIBUJAR UNA FLOR COMPLETA
========================================== */

function dibujarRamoFlor(
    flor,
    tiempo
){

    /*
       Tiempo desde que empieza
    */

    let t =
        (tiempo - flor.delay)
        / 2600;


    if(t < 0)
        return;


    if(t > 1)
        t = 1;


    /*
       Suavizado
    */

    const crecimiento =
        1 -
        Math.pow(
            1-t,
            3
        );


    /*
       Crecimiento del tallo
    */

    const tallo =
        dibujarTallo(
            flor,
            crecimiento,
            tiempo
        );


    /*
       Las hojas aparecen después
       de que crece parte del tallo
    */

    if(
        crecimiento > .35
    ){

        const cantidadHojas =
            Math.floor(
                crecimiento * 4
            );


        for(
            let i=0;
            i<cantidadHojas;
            i++
        ){

            const posicion =
                .38 +
                i*.13;


            const hx =
                tallo.x;


            const hy =
                flor.base*H -
                tallo.altura *
                posicion;


            const lado =
                i%2===0
                    ? -1
                    : 1;


            const aparicion =
                Math.min(
                    1,
                    (crecimiento-.35)*3
                );


            dibujarHoja(

                hx,

                hy,

                lado,

                30 *
                flor.size *
                aparicion,

                aparicion

            );

        }

    }


    /*
       Flor aparece al final
    */

    if(
        crecimiento > .60
    ){

        let apertura =
            (crecimiento-.60)/.40;


        apertura =
            1 -
            Math.pow(
                1-apertura,
                3
            );


        dibujarFlor(

            tallo.x,

            tallo.y,

            flor.size,

            apertura,

            tiempo,

            flor.x*20

        );

    }

}


/* ==========================================
   PARTICULAS / PÉTALOS FLOTANDO
========================================== */

function dibujarParticulas(
    tiempo
){

    particulas.forEach(
        p => {

            const x =
                p.x*W +
                Math.sin(
                    tiempo*.001 +
                    p.phase
                )*20;


            const y =
                ((p.y +
                tiempo*p.speed)
                % 1)*H;


            ctx.fillStyle =
                "rgba(255,239,83,.65)";


            ctx.beginPath();

            ctx.arc(
                x,
                y,
                p.size,
                0,
                Math.PI*2
            );

            ctx.fill();

        }
    );

}


/* ==========================================
   ANIMACIÓN
========================================== */

const inicio =
    performance.now();


function animar(ahora){

    const tiempo =
        ahora -
        inicio;


    /*
       Fondo
    */

    const fondo =
        ctx.createLinearGradient(
            0,
            0,
            0,
            H
        );


    fondo.addColorStop(
        0,
        "#63c8b3"
    );


    fondo.addColorStop(
        .55,
        "#38a99a"
    );


    fondo.addColorStop(
        1,
        "#237d73"
    );


    ctx.fillStyle =
        fondo;


    ctx.fillRect(
        0,
        0,
        W,
        H
    );


    /*
       Partículas
    */

    dibujarParticulas(
        tiempo
    );


    /*
       Flores
    */

    flores.forEach(
        flor => {

            dibujarRamoFlor(
                flor,
                tiempo
            );

        }
    );


    requestAnimationFrame(
        animar
    );

}


requestAnimationFrame(
    animar
);


/* ==========================================
   MÚSICA
========================================== */

const boton =
    document.getElementById(
        "comenzar"
    );

const pantalla =
    document.getElementById(
        "inicio"
    );

const musica =
    document.getElementById(
        "musica"
    );


boton.addEventListener(
    "click",
    async () => {

        try{

            musica.volume = .65;

            await musica.play();

        }catch(e){

            console.log(
                "No se pudo reproducir la música"
            );

        }


        pantalla.classList.add(
            "oculto"
        );

    }
);

</script>

</body>
</html>
